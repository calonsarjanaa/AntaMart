openapi: 3.0.3
info:
  title: AntaMart Transaction & Fulfillment API
  version: 1.0.0
  description: |
    API contract for the transaction and fulfillment MVP. All paths are prefixed by `/api`.
    Store-owner operations require a Sanctum bearer token belonging to a `store_owner`.
servers:
  - url: http://localhost:8000/api
    description: Local Laravel development server
tags:
  - name: Storefront
  - name: Cancellation
  - name: Store owner
  - name: Webhook
paths:
  /checkout:
    post:
      tags: [Storefront]
      summary: Create an order and payment session
      description: Available to guests and authenticated customers. Guest checkout requires guest_email and guest_phone. Idempotency key deduplicates retries.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            example:
              idempotency_key: checkout-2026-0001
              guest_email: shopper@example.com
              guest_phone: '+628123456789'
              items:
                - product_variant_id: 12
                  quantity: 2
              shipping_address:
                recipient_name: Rina Putri
                phone: '+628123456789'
                address_line1: Jl. Mawar 10
                city: Bandung
                province: Jawa Barat
                postal_code: '40111'
                country: ID
              shipping_method: regular
      responses:
        '201':
          description: Order created; payment_url can be null if the gateway could not create a session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '422': {$ref: '#/components/responses/ValidationError'}
  /orders/{id}/payment-session:
    post:
      tags: [Storefront]
      summary: Retry payment-session creation
      description: Only the owning customer or guest with the matching guest email may retry a pending-payment order.
      security: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                guest_email: {type: string, format: email, description: Required for guest orders}
      responses:
        '200': {description: Payment session created}
        '403': {description: Caller is not authorized for this order}
        '404': {description: Order not found}
        '422': {description: Order is not pending payment}
        '502': {description: Payment gateway unavailable}
  /track:
    get:
      tags: [Storefront]
      summary: Look up a guest order
      description: Exact order ID and guest email match required. Limited to 10 requests per minute per IP. Authenticated customer orders are excluded.
      security: []
      parameters:
        - in: query
          name: order_id
          required: true
          schema: {type: string, minLength: 26, maxLength: 26}
        - in: query
          name: email
          required: true
          schema: {type: string, format: email}
      responses:
        '200':
          description: Limited order, item, payment, shipment, and refund status. Address and contact details are omitted.
          content:
            application/json:
              example:
                data:
                  order_id: 01HXYZ1234567890ABCDEFGHJK
                  status: shipped
                  payment_status: paid
                  subtotal: '120000.00'
                  shipping_cost: '15000.00'
                  total: '135000.00'
                  items: []
                  shipment:
                    method: manual
                    tracking_number: TRACK123
                    tracking_url: null
                    shipped_at: '2026-01-01T10:00:00+00:00'
                    delivered_at: null
                  refund_status: not_requested
        '404': {description: Order not found or email did not match}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: Per-IP rate limit exceeded}
  /orders/{id}/cancellation-requests:
    post:
      tags: [Cancellation]
      summary: Submit an order cancellation request
      description: Guest orders require guest_email. At most one pending request is allowed per order.
      security: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 2000}
                guest_email: {type: string, format: email, maxLength: 255}
      responses:
        '201': {description: Cancellation request submitted}
        '404': {description: Order not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /orders/{id}/cancellation-requests/{requestId}/withdraw:
    post:
      tags: [Cancellation]
      summary: Withdraw a pending cancellation request
      description: Only the owning customer or guest with matching email may withdraw before an owner decision.
      security: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - in: path
          name: requestId
          required: true
          schema: {type: integer}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                guest_email: {type: string, format: email}
      responses:
        '200': {description: Request withdrawn}
        '404': {description: Order or request not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/orders/{id}/cancellation-requests/{requestId}/review:
    post:
      tags: [Store owner]
      summary: Approve or reject a cancellation request
      security: [{sanctumBearer: []}]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - in: path
          name: requestId
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approve, reject]}
                rejection_reason: {type: string, maxLength: 2000, description: Required when decision is reject}
      responses:
        '200': {description: Request reviewed}
        '401': {description: Not authenticated}
        '403': {description: Store-owner role required}
        '404': {description: Order or request not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/orders/{id}/cancel:
    post:
      tags: [Store owner]
      summary: Cancel a processing order immediately
      security: [{sanctumBearer: []}]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 2000}
      responses:
        '200': {description: Order cancelled; paid orders may require manual refund}
        '401': {description: Not authenticated}
        '403': {description: Store-owner role required}
        '404': {description: Order not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/orders/{id}/refund/mark-refunded:
    post:
      tags: [Store owner]
      summary: Record an externally executed refund
      description: Does not send money. Only selected resellable order item IDs are restocked.
      security: [{sanctumBearer: []}]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: {type: string, maxLength: 5000}
                resellable_item_ids:
                  type: array
                  items: {type: integer}
                  uniqueItems: true
      responses:
        '200': {description: Refund marked refunded}
        '401': {description: Not authenticated}
        '403': {description: Store-owner role required}
        '404': {description: Order not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/orders/{id}/shipment:
    post:
      tags: [Store owner]
      summary: Add manual shipment tracking
      security: [{sanctumBearer: []}]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tracking_number]
              properties:
                tracking_number: {type: string, maxLength: 255}
                tracking_url: {type: string, format: uri, maxLength: 2048}
      responses:
        '201': {description: Shipment created and order moved to shipped}
        '401': {description: Not authenticated}
        '403': {description: Store-owner role required}
        '404': {description: Order not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/orders/{id}/shipment/confirm-delivery:
    post:
      tags: [Store owner]
      summary: Confirm shipment delivery manually
      security: [{sanctumBearer: []}]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200': {description: Delivery recorded and order moved to completed}
        '401': {description: Not authenticated}
        '403': {description: Store-owner role required}
        '404': {description: Order not found}
        '422': {$ref: '#/components/responses/ValidationError'}
  /webhooks/xendit:
    post:
      tags: [Webhook]
      summary: Receive Xendit payment callback
      description: Requires the configured x-callback-token header. The callback is processed synchronously and duplicate payment IDs are deduplicated.
      security: []
      parameters:
        - in: header
          name: x-callback-token
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {description: Callback acknowledged}
        '403': {description: Invalid callback token}
  /user:
    get:
      tags: [Storefront]
      summary: Return the authenticated Sanctum user
      security: [{sanctumBearer: []}]
      responses:
        '200': {description: Authenticated user}
        '401': {description: Not authenticated}
components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    OrderId:
      in: path
      name: id
      required: true
      schema: {type: string, minLength: 26, maxLength: 26}
  responses:
    ValidationError:
      description: Validation or business-rule failure
      content:
        application/json:
          schema:
            type: object
            properties:
              message: {type: string}
              errors: {type: object, additionalProperties: {type: array, items: {type: string}}}
  schemas:
    CheckoutRequest:
      type: object
      required: [idempotency_key, items, shipping_address]
      properties:
        idempotency_key: {type: string, maxLength: 255}
        guest_email: {type: string, format: email, maxLength: 255}
        guest_phone: {type: string, maxLength: 30}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_variant_id, quantity]
            properties:
              product_variant_id: {type: integer}
              quantity: {type: integer, minimum: 1, maximum: 1000}
        shipping_address:
          type: object
          required: [recipient_name, phone, address_line1, city, province, postal_code]
          properties:
            recipient_name: {type: string, maxLength: 255}
            phone: {type: string, maxLength: 30}
            address_line1: {type: string, maxLength: 255}
            address_line2: {type: string, maxLength: 255}
            city: {type: string, maxLength: 100}
            province: {type: string, maxLength: 100}
            postal_code: {type: string, maxLength: 20}
            country: {type: string, maxLength: 10}
        shipping_method: {type: string, maxLength: 50}
    CheckoutResponse:
      type: object
      properties:
        message: {type: string}
        data:
          type: object
          properties:
            order_id: {type: string}
            status: {type: string, enum: [pending_payment]}
            subtotal: {type: string}
            shipping_cost: {type: string}
            total: {type: string}
            idempotency_key: {type: string}
            payment_url: {type: string, nullable: true}
            expires_at: {type: string, format: date-time, nullable: true}
            items: {type: array, items: {type: object}}
            shipping_address: {type: object}
            created_at: {type: string, format: date-time}
